<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Floating Buttons for QR Codes Tool and Refresh -->
    <div class="floating-buttons">
      <button onclick="navigateHome()" title="Navigate to home page">
        <i class="fa-solid fa-house"></i>
      </button>
      <button onclick="refreshPage()" title="Refresh Page">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>

    <div class="container">
      <h2>QR Codes Tool</h2>
      <p>Generate QR codes based on your entries:</p>

      <div class="buttonsContainer">
        <div style="display: none !important; display: flex; flex-direction: column;"> 
          <input
            type="number"
            id="total-count"
            title="Use it to specify how many QR codes will be generated."
            placeholder="Count (Up to 100 for low latency)"
          />
          <input
            type="number"
            id="digits-count"
            title="Use it to specify how many digits the generated QR codes will consist of."
            placeholder="Number of digits (e.g. 5)"
          />
          <input
            type="text"
            id="prefix"
            title="Use it to convert 'content' to 'PREFIXcontent' when QR code generation happens."
            placeholder="Add prefix (optional)"
          />
        </div>
        <input
          type="text"
          id="manual-codes"
          title="Use it to generate QR codes using a manually input list. e.g. 'QRcontent1,QRcontent2,QRcontent3'"
          placeholder="Manual list entry"
        />

        <hr>
        <p>Define the output images' style:</p>
        <div class="buttonsContainerHorizontal">  
          <label
            for="qrPrintLogoUpload"
            class="file-button"
            id="qrPrintLogoUploadLabel"
            title="Upload logo image file (optional)"
          >
            <i
              class="fa-solid fa-upload"
              id="uploadIcon"
              style="margin-right: 10px"
            ></i>
            Upload logo image
          </label>
          <input
            type="file"
            id="qrPrintLogoUpload"
            accept="image/*"
          />

          <input
            type="url"
            id="qrPrintLogo"
            title="Paste your image in a base64 format (optional) e.g. 'data:image/png;base64,iVBORw0...'"
            placeholder="or paste image in base64 format"
          />
        </div>

        <div class="color-picker-container" id="color-picker-container">
          <label for="color-picker" style="cursor: pointer;">Choose background color:</label>
          <input
            class="color-square"
            type="color"
            id="color-picker"
            value="#888888"
            onchange="changeColor()"
          />
        </div>

        <hr>

        <button id="generateList" onclick="generateMultipleQRCodes()">
          <i 
            class="fas fa-qrcode" 
            style="margin-right: 10px">
          </i>
          Generate QRs
        </button>
        <button id="export-csv-button" style="display: none;" onclick="exportQRCodeAsCSV()" disabled>
          <i
            class="fa-solid fa-download"
            id="uploadIcon"
            style="margin-right: 10px"
          ></i>
          Download generated codes as CSV
        </button>
        <button id="export-button" onclick="downloadQRCodeAsZip()" disabled>
          <i
            class="fa-solid fa-download"
            id="uploadIcon"
            style="margin-right: 10px"
          ></i>
          Download generated images in a ZIP
        </button>
        <button id="copy-button" style="display: none" onclick="copyQRCodeToClipboard()" disabled>
          <i
            class="fa-solid fa-copy"
            id="uploadIcon"
            style="margin-right: 10px"
          ></i>
          Copy QRs image to Clipboard
        </button>
      </div>

      <div id="qr-container">
        <!-- QR codes will be appended here -->
      </div>
    </div>
    <script src="qrgen.js"></script>
  </body>
</html>
